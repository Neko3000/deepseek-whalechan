interface:
  display_name: "whalechan-image-comic"
  short_description: "Create configurable verified Whale-chan comics"
  default_prompt: "Use $whalechan-image-comic to turn my material into N funny Whale-chan comics per source (default 5), using 2N concise candidates and a different agent for priority selection. Show the final plan with panel counts, A/B/C exaggeration tiers, and model cast identities, references, personalities and proportions, then wait for my single confirmation before generating. Preserve my requested visual settings. Inspect each candidate once, accept minor issues that preserve meaning, and use one N-image collection sheet with at most one repair round within the original budget."
